[workspace]
members = ["crates/kten-core", "crates/kten-cli", "crates/kten-mcp"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/sonr09/kaiten-kten"
homepage = "https://github.com/sonr09/kaiten-kten"
description = "Unofficial Kaiten developer tool"
publish = false

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dirs = "6"
httpmock = "0.8"
insta = { version = "1", features = ["json"] }
rmcp = { version = "1.7.0", features = ["client", "server", "transport-async-rw", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "net", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
